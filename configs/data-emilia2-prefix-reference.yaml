extends: base.yaml

# ---- emilia2 only: prefix speaker references (start at frame 0) on selection-v2 ----
# Same rows, text, codec, lengths and holdout as data-emilia2-reference.yaml; only reference placement differs.
root: ${paths.features}
selection_manifest: selections/tts-selection-supervised-tts-20261012T123927bjt-01/manifest.json
tokenizer: ${paths.assembled_model}
workers: 4

reference_policy: self
speaker_conditioning_mode: frozen_embedding
evaluation: no_holdout  # The source build is partitioned into train / validation below.
validation_fraction: 0.001
split_seed: 42

# Targets without a legal reference crop are excluded by the published merge.
bindings:
  - dataset_id: emilia2
    merged_manifest: datasets/emilia2/v0.1/features/merged/emilia2-merged-prefix-reference-features-v1-20261016T142123bjt-01/manifest.json
