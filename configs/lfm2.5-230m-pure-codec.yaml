extends: base.yaml

# ---- Model: assemble locally before building LFM text tokens ----
paths:
  assembled_model: ${paths.project}/assets/assembled/lfm2.5-230m-base-pure-codec

model:
  use_speaker_embedding: false

# ---- Data: preserve the all16 recipe; Qwen token IDs cannot be reused ----
data:
  build_id: supervised-tts-20260929-merged-20261001-all16-lfm2.5-230m

# ---- Experiment: preparation only; this configuration does not submit a job ----
train:
  run_name: supervised-tts-20260929-all16-lfm230m-no-spk-bf16-16gpu-acc2-lr3e-4-bblr1e-4-ep3-wsd
  precision: bf16
  loss_reduction: token
  residual_weight: 0.3
  text_embedding_lr_group: backbone  # LFM embedding and backbone share the pretrained LR.
  lr: 3.0e-4
  backbone_lr: 1.0e-4
  epochs: 3
  max_steps: null
  schedule_steps: null
  warmup_steps: null
  scheduler:
    name: wsd
    warmup_ratio: 0.01
    decay_ratio: 0.1
    min_lr_ratio: 0.1

  # Budgets need throughput profiling before the first production run.
  max_batch_frames: 32000
  max_batch_tokens: 50000
  accumulation: 2
  length_bucket_size: 65536
  first_check_step: 100
  save_every: 2500
  eval_every: 2500
  keep_checkpoints: null

acp:
  nodes: 2
