extends: base.yaml

# ---- Inference device and precision: load an exported checkpoint ----
precision: bf16
device: cuda:0

# ---- Generation: inherit seed from base; derive a seed per sample index ----
generation:
  max_new_tokens: 2048          # Maximum codec frames per sample
  do_sample: true
  top_k: 50
  top_p: 1.0
  temperature: 0.9
  repetition_penalty: 1.05

  # Sampling settings for the residual codebook predictor.
  subtalker_dosample: true
  subtalker_top_k: 50
  subtalker_top_p: 1.0
  subtalker_temperature: 0.9
