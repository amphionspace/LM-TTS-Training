extends: base.yaml

# ---- 推理设备与精度：使用导出的 checkpoint ----
precision: bf16
device: cuda:0

# ---- 生成：seed 继承 base，按样本编号派生独立随机种子 ----
generation:
  max_new_tokens: 2048          # 最大 codec 帧数，避免无界生成
  do_sample: true
  top_k: 50
  top_p: 1.0
  temperature: 0.9
  repetition_penalty: 1.05

  # Residual codebook 预测器的采样设置。
  subtalker_dosample: true
  subtalker_top_k: 50
  subtalker_top_p: 1.0
  subtalker_temperature: 0.9
