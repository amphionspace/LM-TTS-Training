seed: 42
model:
  assembled_model: pretrained/assembled-qwen3-tts-0.6b
  activation_checkpointing: false
data:
  train: data/ljspeech-overfit-64/train.jsonl
  val: data/ljspeech-overfit-64/val.jsonl
  speaker_reference_seconds: 3
train:
  output: runs/ljspeech-overfit-64
  batch_size: 32
  accumulation: 1
  max_steps: 800
  schedule_steps: 800
  warmup_steps: 20
  lr: 0.0003
  backbone_lr: 0.0001
  weight_decay: 0.01
  residual_weight: 0.3
  grad_clip: 1.0
  save_every: 200
  eval_every: 50
  log_every: 5
eval:
  num_samples: 2
  audio_every: 200
  max_frames: 96
  codec: pretrained/assembled-qwen3-tts-0.6b/speech_tokenizer
  asr: true
  asr_model: small.en
  train_num_samples: 2
  codec_device: cuda:0
