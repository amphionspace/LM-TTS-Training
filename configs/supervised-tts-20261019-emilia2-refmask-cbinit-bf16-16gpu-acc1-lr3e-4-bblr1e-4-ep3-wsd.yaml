extends: base.yaml

# ---- Model: the refmask assembly, except the 16 codec embedding tables start from the codec ----
# Code rows are the codec's RVQ codebooks times seeded orthogonal maps (std 0.02); special rows,
# heads and every other weight match qwen3-tts-frozen-conditioning exactly.
paths:
  assembled_model: ${paths.project}/assets/assembled/qwen3-tts-frozen-conditioning-codebook-codec

assembly:
  codec_embedding_init: codebook

# ---- Conditioning: frozen text frontend and a cropped speaker reference (as the refmask run) ----
model:
  use_speaker_embedding: true

# ---- Data: emilia2 from selection-v2 with a fresh sample-level holdout ----
data:
  config: ${paths.project}/configs/data-emilia2-reference.yaml
  build_id: supervised-tts-20261012-emilia2-reference

train:
  run_name: supervised-tts-20261019-emilia2-refmask-cbinit-bf16-16gpu-acc1-lr3e-4-bblr1e-4-ep3-wsd
  precision: bf16
  mask_reference: true  # Exclude reference targets in all 16 codebooks; retain EOS.
  loss_reduction: token
  residual_weight: 0.3

  # Same sample-progress WSD schedule and peak LRs as the 32-GPU baseline.
  epochs: 3
  max_steps: null
  schedule_steps: null
  warmup_steps: null
  lr: 3.0e-4
  backbone_lr: 1.0e-4
  scheduler:
    name: wsd
    warmup_ratio: 0.01
    decay_ratio: 0.1
    min_lr_ratio: 0.1

  # Same per-GPU budgets; one microbatch per optimizer step on 16 GPUs.
  max_batch_frames: 32000
  max_batch_tokens: 50000
  accumulation: 1
  num_workers: 4
  prefetch_factor: 2
  length_bucket_size: 65536

  # Keep every checkpoint; validation and saves share the same cadence.
  log_every: 10
  first_check_step: 100
  keep_checkpoints: null
  save_every: 2500
  eval_every: 2500

eval:
  batch_size: 32

acp:
  nodes: 2
  worker_spec: N3lS.Ii.I60.80c896g  # 8 A800 GPUs, 80 vCPU, 896 GiB per node
