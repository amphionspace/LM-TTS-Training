extends: dots-soar-nv26-data.yaml

# ---- dots.tts-soar on five paralinguistic datasets (nv-canonical-v1, 26 tags), cropped-reference x-vectors ----
# Same recipe as dots-tts-20261103-soar-emilia-nv-refmask-noxvecdrop-...: full-model fine-tuning from soar,
# no x-vector dropout (it gave lower NV-Bench PCER), basic and interleaved layouts 1:1; only the data (Emilia-NV + NonVerbalSpeech-
# 38K + SMIIP-NV + DisfluencySpeech + NonverbalTTS-Expresso, ~753 h) and the 26-tag tokenizer differ.

train:
  run_name: dots-tts-20261103-soar-nv26-5ds-refmask-noxvecdrop-bf16-8gpu-lr1e-5-ep2-wsd
  precision: bf16
  interleave_fraction: 0.5
  xvector_dropout: 0.0

  epochs: 2
  max_steps: null
  schedule_steps: null
  warmup_steps: null
  lr: 1.0e-5
  backbone_lr: 1.0e-5
  scheduler:
    name: wsd
    warmup_ratio: 0.02
    decay_ratio: 0.2
    min_lr_ratio: 0.1

  # Budgets count 6.25 Hz patches; the longest sample has 549 patches and 772 tokens.
  max_batch_frames: 600
  max_batch_tokens: 1000
  accumulation: 1
  num_workers: 4
  prefetch_factor: 2

  log_every: 10
  first_check_step: 50
  keep_checkpoints: null
  save_every: 500
  eval_every: 500

eval:
  batch_size: 16

acp:
  nodes: 1
  worker_spec: N3lS.Ii.I60.80c896g  # 8 A800 GPUs, 80 vCPU, 896 GiB per node
  priority: HIGHEST
