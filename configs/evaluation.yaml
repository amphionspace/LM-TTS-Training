extends: base.yaml

# ---- Metrics: remove groups that are not needed ----
metrics: [content, quality, similarity]

# ---- Scoring models: stored separately from base and assembled training models ----
asr_model: ${paths.evaluation_models}/faster-whisper-small
dnsmos_model: ${paths.evaluation_models}/DNSMOS/sig_bak_ovr.onnx
speaker_model: ${paths.evaluation_models}/wavlm-base-plus-sv

# ---- Resources: scoring runs independently; CPU is the default ----
speaker_device: cpu
speaker_chunk_seconds: 10
max_audio_seconds: 180
cpu_threads: 4

# ---- TensorBoard: truncate listening previews only; score the full audio ----
tensorboard:
  audio_samples: 2              # 0 disables audio previews
  audio_seconds: 20
