extends: base.yaml

# ---- Identity: source selection, all 16 datasets, precision, GPUs, peak LRs, epochs, schedule ----
data:
  build_id: supervised-tts-20260929-merged-20261001-all16

train:
  run_name: supervised-tts-20260929-all16-bf16-32gpu-lr3e-4-bblr1e-4-ep3-wsd
  precision: bf16
  loss_reduction: token
  residual_weight: 0.3

  # Keep the historical peak LRs; scale warmup with corpus progress instead of old step counts.
  epochs: 3
  max_steps: null
  schedule_steps: null
  warmup_steps: null
  lr: 3.0e-4
  backbone_lr: 1.0e-4
  scheduler:
    name: wsd
    warmup_ratio: 0.01     # First 0.03 epoch, independent of the batch budget.
    decay_ratio: 0.1       # Steady until epoch 2.7; cosine decay over the final 0.3 epoch.
    min_lr_ratio: 0.1

  # Per-GPU packed budgets; tune against the peak memory across all GPUs.
  max_batch_frames: 32000
  max_batch_tokens: 50000
  accumulation: 1
  num_workers: 4
  prefetch_factor: 2
  length_bucket_size: 65536  # Group nearby lengths within randomized windows.
  log_every: 10
  first_check_step: 100   # Save and run the complete holdout early, then use the shared cadence.
  save_every: 2500
  eval_every: 2500

eval:
  batch_size: 32

acp:
  nodes: 4
