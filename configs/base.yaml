# Shared defaults. Each configuration extends this file directly and overrides only what it needs.

# ---- Paths: update these when relocating; resource and output paths derive from them ----
paths:
  workspace: /workspace/workspace/yanglin
  project: ${paths.workspace}/LM-TTS-Training
  runs: /workspace/LM-TTS-Training-Runs
  python: ${paths.workspace}/envs/lm-tts/bin/python
  assembled_model: ${paths.project}/assets/assembled/qwen3-tts-frozen-conditioning
  evaluation_models: ${paths.project}/assets/evaluation
  features: /workspace/data/DATA-TTS-UNIFIED

# ---- Communication: current SenseCore defaults; explicit local environment values win ----
environment:
  NCCL_IB_TIMEOUT: "22"       # IB timeout exponent, not seconds
  NCCL_IB_RETRY_CNT: "13"     # Retry setting recommended by this platform
  NCCL_IB_AR_THRESHOLD: "0"   # Message-size threshold for adaptive routing

seed: 42

# ---- Model: assemble locally before training; only completed artifacts can be loaded ----
model:
  assembled_model: ${paths.assembled_model}
  activation_checkpointing: true  # Trade recomputation for lower GPU memory use
  # use_speaker_embedding defaults to true; set false in an ablation experiment.
  # Keep this key absent here to preserve existing checkpoint resume signatures.

# ---- Data: data.yaml pins feature versions; build_id selects the training index ----
data:
  config: ${paths.project}/configs/data.yaml
  build_id: supervised-tts-20260929-merged-20261001-all16
  build_root: ${paths.project}/data/builds/${data.build_id}
  build: ${data.build_root}/train/manifest.json
  val_build: ${data.build_root}/validation/manifest.json
  evaluation: train_isolated     # A fixed sample-level holdout is excluded from training.

# ---- Training: set run_name and precision in the experiment YAML ----
train:
  runs_root: ${paths.runs}

  # Optimizer steps and learning rates. Keep schedule_steps unchanged when resuming.
  max_steps: 100000
  schedule_steps: 100000
  warmup_steps: 1000
  lr: 0.0001                    # New modules, including audio prediction
  backbone_lr: 1.0e-05           # Pretrained Talker backbone
  loss_reduction: token         # token / sample / sqrt
  residual_weight: 0.3

  # Per-GPU dynamic batch budgets; reduce frames / tokens to lower memory use.
  max_batch_frames: 6000
  max_batch_tokens: 16000
  accumulation: 2               # Microbatches accumulated per optimizer update

  # Data loading and bounded shuffling avoid materializing the full corpus.
  num_workers: 4
  prefetch_factor: 2
  shuffle_window: 65536

  # Checkpoint and logging intervals, measured in optimizer steps.
  save_every: 500
  keep_checkpoints: 2
  eval_every: 500                # Only used with an isolated val_build
  log_every: 10
  tensorboard:
    groups: [optimization, performance, batch]  # Select groups; omit per-codebook diagnostics

# ---- In-training validation: separate from generated-audio scoring in evaluation.yaml ----
eval:
  batch_size: 8

# ---- ACP: submission settings share the experiment YAML; only the submitter reads them ----
acp:
  # ---- Compute: experiments usually override only the node count or image ----
  region: cnsh01
  zone: cn-sh-01a
  workspace: workspace-whai
  cluster: cluster-whai
  worker_spec: N3lS.Ii.I60.94c944g  # 8 A800 GPUs per node
  nodes: 2                       # The submission --nodes option takes precedence
  image: registry.cn-sh-01.sensecore.cn/ccr-wh/amphion-base:amphion-base-20260923072955

  # ---- Platform identity and API: keep credentials under home, outside this YAML ----
  subscription: 01a0c34d-630a-719f-bef0-0ba5b6008878
  resource_group: default
  workspace_zone: cn-sh-01z
  api_endpoint: https://aec2.cn-sh-01.sensecoreapi.cn
  home: ${paths.workspace}/acp

  # ---- Storage: reuse default AFS; TensorBoard mounts the shared Runs directory ----
  volume_id: 01a0c847-3d8d-7b42-8c75-50cbd189bb56
  mount_path: /workspace
  ssh_auto_key_setup: true
  tensorboard: platform           # local: use only the standalone dashboard
