# 唯一共享配置。其他 YAML 直接继承本文件，只写用途相关的设置或覆盖项。

# ---- 路径：搬迁时修改这里；资源和输出路径由这些值派生 ----
paths:
  workspace: /workspace/workspace/yanglin
  project: ${paths.workspace}/LM-TTS-Training
  runs: /workspace/LM-TTS-Training-Runs
  python: ${paths.workspace}/envs/lm-tts/bin/python
  assembled_model: ${paths.project}/assets/assembled/qwen3-tts-frozen-conditioning
  evaluation_models: ${paths.project}/assets/evaluation
  features: /workspace/data/DATA-TTS-UNIFIED

# ---- 通信：按当前商汤集群建议；本地已设置的环境变量优先 ----
environment:
  NCCL_IB_TIMEOUT: "22"       # IB 操作超时参数，不是秒数
  NCCL_IB_RETRY_CNT: "13"     # 当前平台建议的重试设置
  NCCL_IB_AR_THRESHOLD: "0"   # 降低使用 adaptive routing 的消息大小门槛

seed: 42

# ---- 模型：提前在本地组装，训练仅加载完成产物 ----
model:
  assembled_model: ${paths.assembled_model}
  activation_checkpointing: true  # 用部分重算换取更低显存

# ---- 数据：data.yaml 选 feature 版本；build_id 选择训练侧索引 ----
data:
  config: ${paths.project}/configs/data.yaml
  build_id: unified-fp32-20260930
  build: ${paths.project}/data/builds/${data.build_id}/manifest.json
  evaluation: no_holdout          # 尚未发布隔离验证集；不生成验证 loss

# ---- 训练：run_name 和 precision 在 train-*.yaml 中指定 ----
train:
  runs_root: ${paths.runs}

  # 训练步数与学习率。恢复时保持 schedule_steps 不变。
  max_steps: 100000
  schedule_steps: 100000
  warmup_steps: 1000
  lr: 0.0001                    # 音频预测等新模块
  backbone_lr: 1.0e-05           # 预训练的 Talker backbone
  loss_reduction: token         # token / sample / sqrt
  residual_weight: 0.3

  # 每张卡的动态组批预算；降低 frames / tokens 可减少显存。
  max_batch_frames: 6000
  max_batch_tokens: 16000
  accumulation: 2               # 每次更新累积的 microbatch 数

  # 数据读取与有界 shuffle，避免展开整个大数据集。
  num_workers: 4
  prefetch_factor: 2
  shuffle_window: 65536

  # 保存和观测频率，单位均为 optimizer step。
  save_every: 500
  keep_checkpoints: 2
  eval_every: 500                # 仅配置独立 val_build 时生效
  log_every: 10
  tensorboard:
    groups: [optimization, performance, batch]  # 按组关闭，避免逐码本刷屏

# ---- 训练中验证：与 evaluation.yaml 的生成音频评分分开 ----
eval:
  batch_size: 8

# ---- ACP 提交：与训练共用一个实验 YAML，提交器读取此区块 ----
acp:
  # ---- 计算资源：通常只需覆盖节点数或镜像 ----
  region: cnsh01
  zone: cn-sh-01a
  workspace: workspace-whai
  cluster: cluster-whai
  worker_spec: N3lS.Ii.I60.94c944g  # 每节点 8 张 A800
  nodes: 2                       # 提交时 --nodes 优先
  image: registry.cn-sh-01.sensecore.cn/ccr-wh/amphion-base:amphion-base-20260923072955

  # ---- 平台身份与 API：固定设置，凭据放 home 下，不写进 YAML ----
  subscription: 01a0c34d-630a-719f-bef0-0ba5b6008878
  resource_group: default
  workspace_zone: cn-sh-01z
  api_endpoint: https://aec2.cn-sh-01.sensecoreapi.cn
  home: ${paths.workspace}/acp

  # ---- 存储与观测：复用默认 AFS，TensorBoard 挂载统一 Runs 目录 ----
  volume_id: 01a0c847-3d8d-7b42-8c75-50cbd189bb56
  mount_path: /workspace
  ssh_auto_key_setup: true
  tensorboard: platform           # local：只使用开发机上的独立仪表盘
