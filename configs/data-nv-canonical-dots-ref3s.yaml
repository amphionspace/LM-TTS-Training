extends: base.yaml

# ---- Five paralinguistic datasets in nv-canonical-v1 text (26 tags), reference-crop CAM++ x-vectors ----
# Same rows, text and selection as data-nv-canonical-dots.yaml; only the reference rule differs:
# dots-reference-v2 spans are at least min(3 s, half the utterance) (v1: 0.64 s), so the x-vector
# sees enough speech (cosine to the whole-utterance x-vector 0.66 -> 0.88 for v1 spans under 1.5 s).
# One selection (tts-selection-supervised-tts-20261103T173114bjt-01) holds out upstream test splits and
# drops unusable rows; the build partitions the rest into train / validation.
paths:
  assembled_model: ${paths.project}/assets/assembled/dots-tts-soar-nv26

root: ${paths.features}
tokenizer: ${paths.assembled_model}
evaluation: no_holdout  # The source build is partitioned into train / validation below.
validation_fraction: 0.01
split_seed: 42

bindings:
  - dataset_id: emilia_nv
    dots_manifest: datasets/emilia_nv/v0.1/features/dots_vae/emilia_nv-dots_vae-dots-tts-soar-vae-xvec-48k-fp32-v2-ref3s-20261106T092453bjt-01/manifest.json
    text_kind: nv-canonical-v1
  - dataset_id: nonverbalspeech38k
    dots_manifest: datasets/nonverbalspeech38k/v0.1/features/dots_vae/nonverbalspeech38k-dots_vae-dots-tts-soar-vae-xvec-48k-fp32-v2-ref3s-20261106T092453bjt-01/manifest.json
    text_kind: nv-canonical-v1
  - dataset_id: smiip_nv
    dots_manifest: datasets/smiip_nv/v0.1/features/dots_vae/smiip_nv-dots_vae-dots-tts-soar-vae-xvec-48k-fp32-v2-ref3s-20261106T092453bjt-01/manifest.json
    text_kind: nv-canonical-v1
  - dataset_id: disfluencyspeech
    dots_manifest: datasets/disfluencyspeech/v0.1/features/dots_vae/disfluencyspeech-dots_vae-dots-tts-soar-vae-xvec-48k-fp32-v2-ref3s-20261106T092453bjt-01/manifest.json
    text_kind: nv-canonical-v1
  - dataset_id: nonverbaltts
    dots_manifest: datasets/nonverbaltts/v0.1/features/dots_vae/nonverbaltts-dots_vae-dots-tts-soar-vae-xvec-48k-fp32-v2-ref3s-20261106T092453bjt-01/manifest.json
    text_kind: nv-canonical-v1
