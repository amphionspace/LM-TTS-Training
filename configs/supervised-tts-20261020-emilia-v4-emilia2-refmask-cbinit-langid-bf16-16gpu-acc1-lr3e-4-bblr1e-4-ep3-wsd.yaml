extends: base.yaml

# ---- Model: codec embeddings from the codec codebooks, plus Dutch/Polish codec language IDs ----
# Same random seed as qwen3-tts-frozen-conditioning; only the 16 codec embedding tables' code rows
# and the config's codec_language_id (dutch 2072, polish 2073) differ.
paths:
  assembled_model: ${paths.project}/assets/assembled/qwen3-tts-frozen-conditioning-codebook-codec-lang

assembly:
  codec_embedding_init: codebook
  extra_codec_languages: true

# ---- Conditioning: frozen text frontend, a cropped speaker reference and codec language IDs ----
# Half of the targets (fixed hash of target_id) keep the Auto prefix so Auto inference still works.
model:
  use_speaker_embedding: true
  language_conditioning: codec_language_id

# ---- Data: emilia (selection-v4, MOSS single-speaker) + emilia2 (selection-v2); fresh holdout ----
data:
  config: ${paths.project}/configs/data-emilia-emilia2-reference.yaml
  build_id: supervised-tts-20261019-emilia-v4-emilia2-reference

train:
  run_name: supervised-tts-20261020-emilia-v4-emilia2-refmask-cbinit-langid-bf16-16gpu-acc1-lr3e-4-bblr1e-4-ep3-wsd
  precision: bf16
  mask_reference: true  # Exclude reference targets in all 16 codebooks; retain EOS.
  loss_reduction: token
  residual_weight: 0.3
  language_auto_fraction: 0.5

  # Same sample-progress WSD schedule and peak LRs as the 32-GPU baseline.
  epochs: 3
  max_steps: null
  schedule_steps: null
  warmup_steps: null
  lr: 3.0e-4
  backbone_lr: 1.0e-4
  scheduler:
    name: wsd
    warmup_ratio: 0.01
    decay_ratio: 0.1
    min_lr_ratio: 0.1

  # Same per-GPU budgets; one microbatch per optimizer step on 16 GPUs.
  max_batch_frames: 32000
  max_batch_tokens: 50000
  accumulation: 1
  num_workers: 4
  prefetch_factor: 2
  length_bucket_size: 65536

  # Keep every checkpoint; validation and saves share the same cadence.
  log_every: 10
  first_check_step: 100
  keep_checkpoints: null
  save_every: 2500
  eval_every: 2500

eval:
  batch_size: 32

acp:
  nodes: 2
  worker_spec: N3lS.Ii.I60.80c896g  # 8 A800 GPUs, 80 vCPU, 896 GiB per node
