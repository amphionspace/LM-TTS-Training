extends: base.yaml

# ---- Ablation: same frozen-text assembly; remove the speaker condition position ----
model:
  use_speaker_embedding: false

# ---- Data: reuse the baseline's fixed sample selection and isolated holdout ----
data:
  build_id: supervised-tts-20260929-merged-20261001-all16

train:
  run_name: supervised-tts-20260929-all16-no-spk-bf16-16gpu-acc2-lr3e-4-bblr1e-4-ep3-wsd
  precision: bf16
  loss_reduction: token
  residual_weight: 0.3

  # Same sample-progress WSD schedule and peak LRs as the 32-GPU baseline.
  epochs: 3
  max_steps: null
  schedule_steps: null
  warmup_steps: null
  lr: 3.0e-4
  backbone_lr: 1.0e-4
  scheduler:
    name: wsd
    warmup_ratio: 0.01
    decay_ratio: 0.1
    min_lr_ratio: 0.1

  # Same per-GPU budgets; 16 GPUs x 2 microbatches replace 32 GPUs x 1.
  max_batch_frames: 32000
  max_batch_tokens: 50000
  accumulation: 2
  num_workers: 4
  prefetch_factor: 2
  length_bucket_size: 65536

  # Keep every checkpoint; validation and saves share the same cadence.
  log_every: 10
  first_check_step: 100
  keep_checkpoints: null
  save_every: 2500
  eval_every: 2500

eval:
  batch_size: 32

acp:
  nodes: 2
