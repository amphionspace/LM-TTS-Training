extends: base.yaml

# ---- v6: v5 data (FlexiVoice style-led subsets + five NV corpora + HiFiTTS-2) plus EARS and Expresso ----
# Design: docs/design/dots-instruct-tts-20261108.md; run book docs/training/dots-instruct-flexivoice-20261109.md.
# FlexiVoice from selection-flexivoice-v6 (parent v4): v4 subsets (WHSP, debatts, ESD/RAVDESS/EMNS, genshin,
# starrail) plus ears and expresso, whose instructions are replaced by the pinned style-only revision
# (annotation flexivoice_instruction: recording-protocol style from the upstream path, no speaker / timbre /
# recording description); the branch column selected_instruction carries it. NV and HiFiTTS-2 bindings are
# exactly those of data-flexivoice-v5-hifitts2-nv-dots-ref3s.yaml. Profile v3-ref3s throughout.
paths:
  assembled_model: ${paths.project}/assets/assembled/dots-tts-soar-nv26

root: ${paths.features}
tokenizer: ${paths.assembled_model}
evaluation: no_holdout  # The source build is partitioned into train / validation below.
validation_fraction: 0.01  # FlexiVoice: speaker fraction; NV bindings: row fraction.
split_seed: 42
instructions: flexivoice-v1

bindings:
  - dataset_id: flexivoice
    dots_manifest: datasets/flexivoice/v0.1/features/dots_vae/flexivoice-dots_vae-dots-tts-soar-vae-xvec-48k-fp32-v3-ref3s-20261116T150105bjt-01/manifest.json
    metadata: flexivoice
    reference: cross_speaker
    text_kind: flexivoice-text-v1
    # Selection owns text revision, subsets, duration/rate, held-out speakers and pairing.
  - dataset_id: emilia_nv
    dots_manifest: datasets/emilia_nv/v0.1/features/dots_vae/emilia_nv-dots_vae-dots-tts-soar-vae-xvec-48k-fp32-v3-ref3s-20261112T121520bjt-01/manifest.json
    text_kind: nv-canonical-v1
  - dataset_id: nonverbalspeech38k
    dots_manifest: datasets/nonverbalspeech38k/v0.1/features/dots_vae/nonverbalspeech38k-dots_vae-dots-tts-soar-vae-xvec-48k-fp32-v3-ref3s-20261112T121520bjt-01/manifest.json
    text_kind: nv-canonical-v1
  - dataset_id: smiip_nv
    dots_manifest: datasets/smiip_nv/v0.1/features/dots_vae/smiip_nv-dots_vae-dots-tts-soar-vae-xvec-48k-fp32-v3-ref3s-20261112T121520bjt-01/manifest.json
    text_kind: nv-canonical-v1
  - dataset_id: disfluencyspeech
    dots_manifest: datasets/disfluencyspeech/v0.1/features/dots_vae/disfluencyspeech-dots_vae-dots-tts-soar-vae-xvec-48k-fp32-v3-ref3s-20261112T121520bjt-01/manifest.json
    text_kind: nv-canonical-v1
  - dataset_id: nonverbaltts
    dots_manifest: datasets/nonverbaltts/v0.1/features/dots_vae/nonverbaltts-dots_vae-dots-tts-soar-vae-xvec-48k-fp32-v3-ref3s-20261112T121520bjt-01/manifest.json
    text_kind: nv-canonical-v1
  - dataset_id: hifitts2
    dots_manifest: datasets/hifitts2/v0.1/features/dots_vae/hifitts2-dots_vae-dots-tts-soar-vae-xvec-48k-fp32-v3-ref3s-20261113T144202bjt-01/manifest.json
