extends: base.yaml

# ---- Cropped speaker references; full text and codec remain unchanged ----
root: ${paths.features}
selection_manifest: selections/tts-selection-supervised-tts-20260929T151539bjt-01/manifest.json
tokenizer: ${paths.assembled_model}
workers: 4  # Reuse tokenization and preserve baseline holdout membership by target ID.
reuse_build: ${paths.project}/data/builds/supervised-tts-20260929-merged-20261001-all16/manifest.json

reference_policy: self
speaker_conditioning_mode: frozen_embedding
evaluation: no_holdout  # The source build is partitioned into train / validation below.
# Train/validation membership comes from reuse_build; do not draw a new holdout.

# ---- All 16 datasets; each manifest pins its own codec / speaker / text provenance ----
bindings:
