extends: base.yaml

# ---- Model: LFM2.5-230M, 2048-wide trainable text frontend, frozen Qwen3-TTS ECAPA speaker encoder ----
paths:
  assembled_model: ${paths.project}/assets/assembled/lfm2.5-230m-base-text2048-spk

assembly:
  family: lfm2
  text_frontend: qwen-mlp
  speaker_encoder: true  # Template speaker_encoder.*; all other weights match the pure-codec recipe.

model:
  use_speaker_embedding: true

# ---- Data: emilia2 cropped references; LFM token IDs, same holdout rows as the Qwen emilia2 build ----
data:
  config: ${paths.project}/configs/data-emilia2-reference.yaml
  build_id: supervised-tts-20261012-emilia2-reference-lfm2.5-230m

train:
  run_name: supervised-tts-20261012-emilia2-lfm230m-text2048-spk-refmask-bf16-8gpu-acc2-lr3e-4-bblr1e-4-ep3-wsd
  precision: bf16
  mask_reference: true  # Exclude reference targets in all 16 codebooks; retain EOS.
  loss_reduction: token
  residual_weight: 0.3
  text_embedding_lr_group: backbone  # Embedding/backbone use backbone_lr; the new projector uses lr.

  epochs: 3
  max_steps: null
  schedule_steps: null
  warmup_steps: null
  lr: 3.0e-4
  backbone_lr: 1.0e-4
  scheduler:
    name: wsd
    warmup_ratio: 0.01
    decay_ratio: 0.1
    min_lr_ratio: 0.1

  # 64k and 48k frames ran out of memory in the Code Predictor on 80 GiB A800s.
  # 8 GPUs x 32k frames x 2 microbatches matches the Qwen emilia2 run's 16 x 32k.
  max_batch_frames: 32000
  max_batch_tokens: 50000
  accumulation: 2
  num_workers: 4
  prefetch_factor: 2
  length_bucket_size: 65536

  log_every: 10
  first_check_step: 100
  keep_checkpoints: null
  save_every: 1000
  eval_every: 1000

eval:
  batch_size: 32

acp:
  nodes: 1
  worker_spec: N3lS.Ii.I60.80c896g  # 8 A800 GPUs, 80 vCPU, 896 GiB per node
