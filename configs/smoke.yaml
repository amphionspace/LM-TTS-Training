seed: 42
model:
  backbone: null
  tiny: true
  activation_checkpointing: true
data:
  train: data/synthetic-smoke/train.jsonl
  val: data/synthetic-smoke/val.jsonl
train:
  output: runs/smoke
  batch_size: 1
  accumulation: 2
  max_steps: 3
  schedule_steps: 10
  warmup_steps: 1
  lr: 0.001
  backbone_lr: 0.001
  weight_decay: 0.01
  residual_weight: 0.3
  grad_clip: 1.0
  save_every: 1
  eval_every: 1
  log_every: 1
eval:
  audio_every: 0
  max_frames: 4
  asr: false
  codec: pretrained/Qwen3-TTS-Tokenizer-12Hz
