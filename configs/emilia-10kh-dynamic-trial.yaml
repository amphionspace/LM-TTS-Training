seed: 42
model:
  assembled_model: pretrained/assembled-qwen3-tts-frozen-conditioning
  activation_checkpointing: false
  attn_implementation: flash_attention_2
data:
  train: runs/emilia-10kh-partial-trial-20260909/data/train.jsonl
  val: runs/emilia-10kh-partial-trial-20260909/data/val.jsonl
train:
  output: runs/emilia-10kh-dynamic-trial-20260909/train-workers16
  max_batch_frames: 6000
  max_batch_tokens: 9000
  accumulation: 1
  num_workers: 16
  prefetch_factor: 2
  max_steps: 100
  schedule_steps: 1000
  warmup_steps: 1000
  lr: 0.0003
  backbone_lr: 0.0001
  weight_decay: 0.01
  residual_weight: 0.3
  grad_clip: 1.0
  save_every: 100
  keep_checkpoints: null
  eval_every: 100
  log_every: 1
eval:
  batch_size: 8
  conditioning_modes: [speaker_only, icl]
  num_samples: 2
  train_num_samples: 0
  audio_every: 100
  max_frames: 8
  codec: pretrained/Qwen3-TTS-Tokenizer-12Hz
  codec_device: cuda:0
  asr: false
