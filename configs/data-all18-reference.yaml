extends: base.yaml

# ---- All 18 datasets on selection-v2 (upstream test splits held out); cropped speaker references ----
root: ${paths.features}
selection_manifest: selections/tts-selection-supervised-tts-20261012T123927bjt-01/manifest.json
tokenizer: ${paths.assembled_model}
workers: 8  # Independent datasets build concurrently; emilia2 (76.7M rows) is the critical path.

reference_policy: self
speaker_conditioning_mode: frozen_embedding
evaluation: no_holdout  # The source build is partitioned into train / validation below.
validation_fraction: 0.001
split_seed: 42  # Holdout rows are seeded per dataset, so emilia2 matches the emilia2-only build.

# Targets without a legal reference crop are excluded by each published merge.
bindings:
  - dataset_id: aishell3
    merged_manifest: datasets/aishell3/v0.1/features/merged/aishell3-merged-reference-features-v1-20261013T004007bjt-01/manifest.json

  - dataset_id: csemotions
    merged_manifest: datasets/csemotions/v0.1/features/merged/csemotions-merged-reference-features-v1-20261013T004007bjt-01/manifest.json

  - dataset_id: emilia
    merged_manifest: datasets/emilia/v0.1/features/merged/emilia-merged-reference-features-v1-20261013T004007bjt-01/manifest.json

  - dataset_id: emilia2
    merged_manifest: datasets/emilia2/v0.1/features/merged/emilia2-merged-reference-features-v1-20261013T063612bjt-01/manifest.json

